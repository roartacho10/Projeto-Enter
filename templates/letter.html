<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>{{ doc.title }}</title>
<style>
  @font-face {font-family:ReportSans; src:url('{{ fonts.regular }}') format('truetype'); font-weight:400;}
  @font-face {font-family:ReportSans; src:url('{{ fonts.bold }}') format('truetype'); font-weight:700;}
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: ReportSans, sans-serif;
    color: #1A1A1A; font-size: 9.2pt; line-height: 1.45;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .page { width: 210mm; height: 297mm; padding: 6mm 18mm 11mm; position: relative;
          overflow: hidden; page-break-after: always; }
  /* Auto-fit: the renderer measures the page and steps this down within declared
     bounds rather than letting prose length decide whether the layout survives. */
  .fit { zoom: var(--fit, 1); }
  .page:last-child { page-break-after: auto; }
  body {counter-reset:sheet;}
  .page::after {counter-increment:sheet; content:counter(sheet) ' / 2'; position:absolute;
               bottom:3mm; right:18mm; font-size:7pt; color:#777;}

  /* ---- header, mirroring the XP research note ---- */
  .kicker { display: flex; justify-content: flex-end; align-items: baseline; gap: 6px;
            font-size: 8.4pt; padding: 0 0 2.5mm; }
  .kicker b { font-weight: 700; }
  .kicker span { color: #8A8A8A; }
  /* Page two repeats the band with the logo alone. The kicker row is kept as an
     empty spacer of the same height so the black block starts at the same
     vertical offset on both pages - a continuation header that lines up. */
  /* Not height:0 - the line box has to exist, or the band starts higher on
     page two than on page one and the two headers stop lining up. */
  .kicker.spacer { visibility: hidden; }
  .band { background: #231F20; color: #fff; margin: 0; padding: 4.5mm 5mm 5mm;
          position: relative; }
  .band .eyebrow { color: #FFC700; font-size: 13pt; font-weight: 400; margin: 0 0 2mm; }
  .band h1 { font-size: 16pt; font-weight: 400; line-height: 1.25; margin: 0; max-width: calc(100% - 23mm); }
  .band .sub { font-size: 10.5pt; color: #D8D8D8; margin: 2mm 0 0; }
  /* The logo is 15mm wide and ~13.5mm tall; the continuation band has no text
     to give it height, so it is declared tall enough to contain the logo
     instead of letting it spill over the edges. */
  .band.cont { padding: 2mm 18mm; min-height: 18mm; }
  .logo { position: absolute; right: 5mm; top: 50%; transform: translateY(-50%);
          width: 15mm; height: auto; display: block; }

  /* ---- key takeaways ---- */
  .highlights { background: #FDF3D0; border-left: 3px solid #FFC700;
                padding: 3mm 4.5mm 2.4mm; margin: 2mm 0 3mm; }
  .highlights p { margin: 0 0 2.4mm; line-height: 1.4; }
  .highlights p:last-child { margin-bottom: 0; }

  p.body { text-align: left; margin: 0 0 2.8mm; }
  p.body .lead { font-weight: 700; }
  /* One section heading style, used by every section without exception. */
  h2 { font-size: 10pt; margin: 3.5mm 0 2mm; padding-bottom: 1mm;
       border-bottom: 1px solid #D9D9D9; }
  .page > .fit > h2:first-child { margin-top: 3mm; }

  /* ---- tables ----
     Header and value share one alignment per column: the class sits on both the
     th and the td, so a right-aligned figure can never sit under a
     left-aligned label. */
  table.kpi { width: 100%; border-collapse: collapse; margin: 1mm 0 2mm; }
  table.kpi th { text-align: left; font-weight: 700; padding: 1.6mm 2mm;
                 border-bottom: 1.2px solid #1A1A1A; }
  table.kpi th.n { text-align: right; }
  table.kpi th.c, table.kpi td.c { text-align: center; }
  table.kpi td { padding: 1.25mm 2mm; border-bottom: 1px solid #EDEDED; }
  table.kpi td.n { text-align: right; font-variant-numeric: tabular-nums; white-space:nowrap; }
  table.kpi tr.total td { font-weight: 700; border-top: 1.2px solid #1A1A1A;
                          border-bottom: none; }

  /* ---- figures: titled like a table, not boxed like a sidebar ---- */
  figure { margin: 2mm 0 3mm; padding: 0; }
  figure figcaption { text-align: left; padding-bottom: 1mm; margin-bottom: 1.5mm;
                      border-bottom: 1.2px solid #1A1A1A; }
  figure .ftitle { font-weight: 700; display: block; }
  figure .fsource { color: #6B6B6B; font-size: 7.6pt; display: block; margin-top: 0.4mm; }
  figure svg { width: 100%; height: auto; display: block; }
  figure svg text {font-family:ReportSans, sans-serif !important;}

  .kpinote { color: #6B6B6B; font-size: 7.6pt; margin: -1mm 0 2mm 2mm; }
  .poswrap { display: flex; gap: 6mm; }
  table.trades td { padding: 1.1mm 2mm; }
  table.trades td.acao { font-weight: 700; white-space: nowrap; }
  table.pos td { padding: 0.9mm 1.5mm; }
  table.pos th { padding: 1.2mm 1.5mm; }

  /* ---- foot of page two: signature, then the disclaimer ---- */
  .pagefoot { position: absolute; left: 18mm; right: 18mm; bottom: 8mm; }
  .signature { margin: 0 0 3mm; font-size:8.5pt; }
  .signature b { display: block; }
  .signature span { color: #4A4A4A; }
  .disclaimer { border-top: 1px solid #D9D9D9; padding-top: 2mm;
                color: #6B6B6B; font-size: 6.9pt; line-height: 1.35; text-align: left; }
  p.body, .disclaimer {text-align:justify;}
  .band {margin-left:-5mm; margin-right:-5mm;}
  .opening {margin-top:4mm !important;}
  .executive {padding:0; background:none;}
  .continuation {padding-top:9mm;}
  table.kpi th:first-child, table.kpi td:first-child {padding-left:0;}
  table.kpi th:last-child, table.kpi td:last-child {padding-right:0;}
  .kpinote {margin-left:0; text-align:justify;}
  table.monthly td {padding-top:.85mm; padding-bottom:.85mm;}
  table.kpi .group td {font-weight:700; background:#F7F7F5; padding-top:1.5mm;}
  .up {color:#216343;} .down {color:#A43832;}
  table.trades {font-size:8.3pt;}
  table.trades td.acao {font-weight:400;}
  table.trades th:nth-child(2) {width:55%;}
</style></head><body style="--fit: {{ doc.fit }}">
{% include "letter_body.html" %}
</body></html>
